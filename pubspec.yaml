name: chase_cloud
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  firebase_core: ^4.15.0
  get_it: ^9.3.0
  flutter_bloc: ^9.1.1
  auto_route: ^11.2.0
  dart_mappable: ^4.10.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.12.0
  flutter_gen_runner: ^5.13.0+1
  auto_route_generator: ^10.6.0
  dart_mappable_builder: ^4.10.0
  flutter_feature_cli: ^1.2.0

flutter_gen_runner:
  options:
    output: lib/gen

flutter_feature_cli:
  path: 'lib/src/features'

flutter:
  uses-material-design: true

